name: Rust

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false

      - name: Checkout metis.rs
        uses: actions/checkout@v4
        with:
          path: metis.rs

      - name: Checkout athena.rs
        uses: actions/checkout@v4
        with:
          repository: ai4waifu/athena.rs
          ref: dev
          path: athena.rs

      - name: Checkout oaks
        uses: actions/checkout@v4
        with:
          repository: ygg-lang/oaks
          ref: dev
          path: oaks

      - name: Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Build
        working-directory: metis.rs
        run: cargo build --release

      - name: Tests
        working-directory: metis.rs
        run: cargo test --release
