[workspace]
resolver = "2"
members = ["projects/*"]
default-members = ["projects/metis-example"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"

[workspace.dependencies]
metis-types = { path = "projects/metis-types" }
metis-graph = { path = "projects/metis-graph" }
metis-island = { path = "projects/metis-island" }
metis-lang = { path = "projects/metis-lang" }
metis = { path = "projects/metis" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = "symbols"
panic = "abort"
